[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exshg"
version = "0.2.0"
description = "Second-harmonic generation with excitons from ELK Bethe-Salpeter calculations"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Cuiju Yu" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.6"]

[project.scripts]
exshg = "exshg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["exshg"]

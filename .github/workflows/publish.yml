name: publish

# Builds the package and uploads it to PyPI when a version tag (v*) is pushed.
# Uses PyPI trusted publishing: no password or token is stored anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/exshg/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
